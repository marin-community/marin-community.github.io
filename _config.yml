theme: jekyll-theme-minimal
repository: marin-community/marin-community.github.io
url: https://marin.community
title: Marin
logo: assets/images/marin-logo.svg
permalink: /blog/:year/:month/:day/:title/
future: true
collections:
  research_notes:
    output: true
    permalink: /research-notes/:name/
defaults:
  - scope:
      path: ""
      type: research_notes
    values:
      layout: post
plugins:
  - jekyll-seo-tag
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  gfm_quirks: paragraph_end
  syntax_highlighter_opts:
    default_lang: plaintext
sass:
  style: compressed
exclude:
  - blog_style.py
  - make_figures.py
  - scripts
  - docs
  - vendor
  - Gemfile
  - Gemfile.lock
