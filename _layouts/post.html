---
layout: default
---

<small>{{ page.date | date: "%-d %B %Y" }}</small>
<h1>{{ page.title }}</h1>

<p class="view">
{% for author in page.authors %}
    <div style="text-align: center; margin: 15px 0;">{{ author }}</div>
{% endfor %}
</p>

{% if page.author_notes %}
<p class="view">
{% for note in page.author_notes %}
    <div style="text-align: center; font-size: 0.85em; margin: 4px 0;">{{ note }}</div>
{% endfor %}
</p>
{% endif %}

<hr/>

{{content}}
