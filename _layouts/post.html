---
layout: blog
---
<article class="post original-post">
  <header class="post-header">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">← All writing</a>
    <p class="eyebrow">Marin</p>
    <h1>{{ page.title | escape }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%-d %B %Y' }}</time></p>
    <div class="post-authors">{% for author in page.authors %}<p>{{ author }}</p>{% endfor %}</div>
    {% for note in page.author_notes %}<p class="author-note">{{ note }}</p>{% endfor %}
  </header>
  <div class="original-content">{{ content }}</div>
  <p class="post-end"><a href="{{ '/blog/' | relative_url }}">← More from Marin</a></p>
</article>
