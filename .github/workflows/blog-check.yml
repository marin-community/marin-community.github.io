name: Blog build and content checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  blog-check:
    # Ruby 3.4.7 is available on this image; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/blog-sync-requirements.txt
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_BUILD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check content, attribution, figures and local links
        run: python scripts/check_blog.py
      - name: Check published report routes and rendering
        run: python scripts/check_reports.py
