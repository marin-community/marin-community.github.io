<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1192" width="1160" height="1192" color="#1f1e1b"><style>text{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}.sb{fill:#ebe2d9;stroke:#8f857b;stroke-width:1.2}.nb{fill:#e7c9ad;stroke:#9e6d43;stroke-width:1.6}.t{font-size:12.5px;fill:#1f1e1b}.s{font-size:11px;fill:#5d564e}.a{stroke:#1f1e1b;stroke-width:1.2;opacity:.75}.lg{fill:#385c8f}.ll{fill:#b9c7dc}.ph{font-size:15px;font-weight:600;fill:#1f1e1b}</style><g transform="translate(0 0)"><text class="ph" x="0" y="18">Stack</text><g transform="translate(0 26)"><svg x="0" y="0" width="560" height="560" viewBox="0 0 560 560" role="img" aria-label="Full stack: embedding, RMSNorm and GatedNorm, 48 all-MoE blocks with 3 local layers per global layer, final norms, untied lm_head with logit z-loss"><defs><marker id="ah-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text class="s" x="280" y="22" text-anchor="middle">token ids</text><line class="a" x1="280" y1="28" x2="280" y2="44" marker-end="url(#ah-stack)"/><rect class="sb" x="130.0" y="46" width="300" height="34" rx="5"/><text class="t" x="280.0" y="67.0" text-anchor="middle">Token embedding (untied)</text><line class="a" x1="280" y1="80" x2="280" y2="96" marker-end="url(#ah-stack)"/><rect class="nb" x="130.0" y="98" width="300" height="34" rx="5"/><text class="t" x="280.0" y="112.0" text-anchor="middle">RMSNorm → GatedNorm</text><text class="s" x="280.0" y="127.0" text-anchor="middle">norm on the embedding</text><line class="a" x1="280" y1="132" x2="280" y2="148" marker-end="url(#ah-stack)"/><rect class="nb" x="130.0" y="150" width="300" height="48" rx="5"/><text class="t" x="280.0" y="171.0" text-anchor="middle">48 × Block</text><text class="s" x="280.0" y="186.0" text-anchor="middle">every block is MoE · no leading dense layers</text><line class="a" x1="280" y1="198" x2="280" y2="214" marker-end="url(#ah-stack)"/><rect class="nb" x="130.0" y="216" width="300" height="34" rx="5"/><text class="t" x="280.0" y="237.0" text-anchor="middle">RMSNorm → GatedNorm</text><line class="a" x1="280" y1="250" x2="280" y2="266" marker-end="url(#ah-stack)"/><rect class="sb" x="130.0" y="268" width="300" height="34" rx="5"/><text class="t" x="280.0" y="289.0" text-anchor="middle">lm_head (untied, 128k vocab)</text><line class="a" x1="280" y1="302" x2="280" y2="318" marker-end="url(#ah-stack)"/><rect class="sb" x="130.0" y="320" width="300" height="34" rx="5"/><text class="t" x="280.0" y="341.0" text-anchor="middle">Cross-entropy + logit z-loss (1e-4)</text><text class="t" x="280" y="392" text-anchor="middle">Layer pattern (48 layers, hidden 6144, 48 heads × 128)</text><rect class="ll" x="40.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="50.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="60.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="70.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="80.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="90.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="100.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="110.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="120.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="130.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="140.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="150.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="160.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="170.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="180.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="190.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="200.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="210.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="220.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="230.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="240.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="250.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="260.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="270.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="280.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="290.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="300.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="310.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="320.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="330.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="340.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="350.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="360.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="370.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="380.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="390.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="400.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="410.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="420.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="430.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="440.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="450.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="460.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="470.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="480.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="490.5" y="404" width="9" height="26" rx="1.5"/><rect class="ll" x="500.5" y="404" width="9" height="26" rx="1.5"/><rect class="lg" x="510.5" y="404" width="9" height="26" rx="1.5"/><text class="s" x="40.5" y="446" text-anchor="start">1</text><text class="s" x="519.5" y="446" text-anchor="end">48</text><rect class="ll" x="40.5" y="466" width="12" height="12" rx="2"/><text class="s" x="58.5" y="476" text-anchor="start">local ×36: sliding window 2048 · half RoPE · 12 KV heads</text><rect class="lg" x="40.5" y="490" width="12" height="12" rx="2"/><text class="s" x="58.5" y="500" text-anchor="start">global ×12: full causal · no RoPE · 6 KV heads</text></svg></g></g><g transform="translate(600 0)"><text class="ph" x="0" y="18">Block</text><g transform="translate(0 26)"><svg x="0" y="0" width="560" height="590" viewBox="0 0 560 590" role="img" aria-label="One block: pre-norm with RMSNorm then GatedNorm, attention, SConv on the attention output, residual add; then RMSNorm, GatedNorm, routed MoE plus two shared experts, SConv on the MoE output, residual add"><defs><marker id="ah-block" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text class="t" x="300" y="20" text-anchor="middle">x</text><line class="a" x1="300" y1="26" x2="300" y2="40" marker-end="url(#ah-block)"/><rect class="sb" x="180.0" y="42" width="240" height="34" rx="5"/><text class="t" x="300.0" y="63.0" text-anchor="middle">RMSNorm</text><line class="a" x1="300" y1="76" x2="300" y2="88" marker-end="url(#ah-block)"/><rect class="nb" x="180.0" y="90" width="240" height="34" rx="5"/><text class="t" x="300.0" y="104.0" text-anchor="middle">GatedNorm</text><text class="s" x="300.0" y="119.0" text-anchor="middle">x · σ(silu(x·W↓)·W↑), rank 128</text><line class="a" x1="300" y1="124" x2="300" y2="136" marker-end="url(#ah-block)"/><rect class="sb" x="180.0" y="138" width="240" height="34" rx="5"/><text class="t" x="300.0" y="152.0" text-anchor="middle">Attention</text><text class="s" x="300.0" y="167.0" text-anchor="middle">detail below</text><line class="a" x1="300" y1="172" x2="300" y2="184" marker-end="url(#ah-block)"/><rect class="nb" x="180.0" y="186" width="240" height="34" rx="5"/><text class="t" x="300.0" y="200.0" text-anchor="middle">SConv (kernel 4)</text><text class="s" x="300.0" y="215.0" text-anchor="middle">on attention output</text><line class="a" x1="300" y1="220" x2="300" y2="232" marker-end="url(#ah-block)"/><circle class="sb" cx="300" cy="242" r="9"/><line class="a" x1="295" y1="242" x2="305" y2="242"/><line class="a" x1="300" y1="237" x2="300" y2="247"/><path class="a" d="M300,32 H80 V242 H289" fill="none" marker-end="url(#ah-block)"/><text class="s" x="74" y="140" text-anchor="end">residual</text><line class="a" x1="300" y1="251" x2="300" y2="266" marker-end="url(#ah-block)"/><rect class="sb" x="180.0" y="268" width="240" height="34" rx="5"/><text class="t" x="300.0" y="289.0" text-anchor="middle">RMSNorm</text><line class="a" x1="300" y1="302" x2="300" y2="314" marker-end="url(#ah-block)"/><rect class="nb" x="180.0" y="316" width="240" height="34" rx="5"/><text class="t" x="300.0" y="337.0" text-anchor="middle">GatedNorm</text><path class="a" d="M300,350 V364 H210 V380" fill="none" marker-end="url(#ah-block)"/><path class="a" d="M300,364 H390 V380" fill="none" marker-end="url(#ah-block)"/><rect class="sb" x="130" y="382" width="160" height="34" rx="5"/><text class="t" x="210.0" y="396.0" text-anchor="middle">Routed MoE</text><text class="s" x="210.0" y="411.0" text-anchor="middle">8 of 384 · detail below</text><rect class="sb" x="310" y="382" width="160" height="34" rx="5"/><text class="t" x="390.0" y="396.0" text-anchor="middle">2 shared experts</text><text class="s" x="390.0" y="411.0" text-anchor="middle">SwiGLU · width 3072</text><path class="a" d="M210,416 V432 H289" fill="none" marker-end="url(#ah-block)"/><path class="a" d="M390,416 V432 H311" fill="none" marker-end="url(#ah-block)"/><circle class="sb" cx="300" cy="432" r="9"/><line class="a" x1="295" y1="432" x2="305" y2="432"/><line class="a" x1="300" y1="427" x2="300" y2="437"/><line class="a" x1="300" y1="441" x2="300" y2="456" marker-end="url(#ah-block)"/><rect class="nb" x="180.0" y="458" width="240" height="34" rx="5"/><text class="t" x="300.0" y="472.0" text-anchor="middle">SConv (kernel 4)</text><text class="s" x="300.0" y="487.0" text-anchor="middle">on MoE output</text><line class="a" x1="300" y1="492" x2="300" y2="506" marker-end="url(#ah-block)"/><circle class="sb" cx="300" cy="516" r="9"/><line class="a" x1="295" y1="516" x2="305" y2="516"/><line class="a" x1="300" y1="511" x2="300" y2="521"/><path class="a" d="M300,256 H80 V516 H289" fill="none" marker-end="url(#ah-block)"/><line class="a" x1="300" y1="525" x2="300" y2="548" marker-end="url(#ah-block)"/><text class="s" x="300" y="566" text-anchor="middle">to next block</text></svg></g></g><g transform="translate(0 646)"><text class="ph" x="0" y="18">Attention</text><g transform="translate(0 26)"><svg x="0" y="0" width="560" height="520" viewBox="0 0 560 520" role="img" aria-label="Attention: Q K V projections, SConv on K, fixed RMS QK-norm, half RoPE on local layers only, Q scaled by fixed 1.3, attention, XSA removes the component along each head's own value, per-head gate, output projection"><defs><marker id="ah-attn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text class="t" x="280" y="20" text-anchor="middle">x (from GatedNorm)</text><path class="a" d="M280,28 V36 H130 V48" fill="none" marker-end="url(#ah-attn)"/><rect class="sb" x="65.0" y="50" width="130" height="34" rx="5"/><text class="t" x="130.0" y="71.0" text-anchor="middle">W_q</text><path class="a" d="M280,28 V36 H280 V48" fill="none" marker-end="url(#ah-attn)"/><rect class="sb" x="215.0" y="50" width="130" height="34" rx="5"/><text class="t" x="280.0" y="71.0" text-anchor="middle">W_k</text><path class="a" d="M280,28 V36 H430 V48" fill="none" marker-end="url(#ah-attn)"/><rect class="sb" x="365.0" y="50" width="130" height="34" rx="5"/><text class="t" x="430.0" y="71.0" text-anchor="middle">W_v</text><line class="a" x1="280" y1="84" x2="280" y2="96" marker-end="url(#ah-attn)"/><rect class="nb" x="215.0" y="98" width="130" height="34" rx="5"/><text class="t" x="280.0" y="119.0" text-anchor="middle">SConv (k=4)</text><line class="a" x1="130" y1="84" x2="130" y2="146" marker-end="url(#ah-attn)"/><line class="a" x1="280" y1="132" x2="280" y2="146" marker-end="url(#ah-attn)"/><rect class="nb" x="65.0" y="148" width="280" height="34" rx="5"/><text class="t" x="205.0" y="169.0" text-anchor="middle">RMS QK-norm, no learned gain</text><line class="a" x1="130" y1="182" x2="130" y2="194" marker-end="url(#ah-attn)"/><line class="a" x1="280" y1="182" x2="280" y2="194" marker-end="url(#ah-attn)"/><rect class="sb" x="65.0" y="196" width="280" height="34" rx="5"/><text class="t" x="205.0" y="217.0" text-anchor="middle">Half RoPE (local) · no RoPE (global)</text><line class="a" x1="130" y1="230" x2="130" y2="242" marker-end="url(#ah-attn)"/><rect class="nb" x="65.0" y="244" width="130" height="34" rx="5"/><text class="t" x="130.0" y="265.0" text-anchor="middle">Q × 1.3 (fixed)</text><line class="a" x1="130" y1="278" x2="130" y2="296" marker-end="url(#ah-attn)"/><line class="a" x1="280" y1="230" x2="280" y2="296" marker-end="url(#ah-attn)"/><line class="a" x1="430" y1="84" x2="430" y2="296" marker-end="url(#ah-attn)"/><rect class="sb" x="65.0" y="298" width="430" height="34" rx="5"/><text class="t" x="280.0" y="319.0" text-anchor="middle">Attention · GQA · SWA 2048 (local) / full causal (global)</text><line class="a" x1="280" y1="332" x2="280" y2="346" marker-end="url(#ah-attn)"/><rect class="nb" x="65.0" y="348" width="430" height="34" rx="5"/><text class="t" x="280.0" y="369.0" text-anchor="middle">XSA: subtract each head's component along its own v</text><path class="a" d="M495.0,67 H509.0 V365 H497.0" fill="none" marker-end="url(#ah-attn)"/><text class="s" x="513.0" y="220" text-anchor="start">v</text><line class="a" x1="280" y1="382" x2="280" y2="396" marker-end="url(#ah-attn)"/><rect class="sb" x="65.0" y="398" width="430" height="34" rx="5"/><text class="t" x="280.0" y="419.0" text-anchor="middle">Per-head gate 2σ(x·g), zero-init</text><line class="a" x1="280" y1="432" x2="280" y2="446" marker-end="url(#ah-attn)"/><rect class="sb" x="65.0" y="448" width="430" height="34" rx="5"/><text class="t" x="280.0" y="469.0" text-anchor="middle">W_o</text><line class="a" x1="280" y1="482" x2="280" y2="504" marker-end="url(#ah-attn)"/></svg></g></g><g transform="translate(600 646)"><text class="ph" x="0" y="18">Routed MoE</text><g transform="translate(0 26)"><svg x="0" y="0" width="560" height="470" viewBox="0 0 560 470" role="img" aria-label="Routed MoE: the router reads the full-width token in fp32 and adds a stop-gradient quantile-balancing bias, takes the top 8 of 384, and uses sigmoid weights renormalized to 2.5; the token is compressed to a 3072 latent, RMS-normalized, dispatched over the expert-parallel all-to-all to 8 SwiGLU experts, combined, and projected back to 6144"><defs><marker id="ah-moe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text class="t" x="270" y="20" text-anchor="middle">x (6144, from GatedNorm)</text><path class="a" d="M270,28 V36 H140 V48" fill="none" marker-end="url(#ah-moe)"/><path class="a" d="M270,36 H400 V48" fill="none" marker-end="url(#ah-moe)"/><rect class="sb" x="42.0" y="50" width="196" height="34" rx="5"/><text class="t" x="140.0" y="71.0" text-anchor="middle">Router (fp32, full width)</text><line class="a" x1="140" y1="84" x2="140" y2="96" marker-end="url(#ah-moe)"/><rect class="nb" x="42.0" y="98" width="196" height="34" rx="5"/><text class="t" x="140.0" y="112.0" text-anchor="middle">+ QB bias on raw logits</text><text class="s" x="140.0" y="127.0" text-anchor="middle">stop-grad · histogram quantile</text><line class="a" x1="140" y1="132" x2="140" y2="144" marker-end="url(#ah-moe)"/><rect class="sb" x="42.0" y="146" width="196" height="34" rx="5"/><text class="t" x="140.0" y="167.0" text-anchor="middle">Top-8 of 384 experts</text><line class="a" x1="140" y1="180" x2="140" y2="192" marker-end="url(#ah-moe)"/><rect class="sb" x="42.0" y="194" width="196" height="34" rx="5"/><text class="t" x="140.0" y="215.0" text-anchor="middle">Sigmoid weights, renorm Σ = 2.5</text><rect class="sb" x="302.0" y="50" width="196" height="34" rx="5"/><text class="t" x="400.0" y="71.0" text-anchor="middle">Latent down 6144 → 3072</text><line class="a" x1="400" y1="84" x2="400" y2="96" marker-end="url(#ah-moe)"/><rect class="nb" x="302.0" y="98" width="196" height="34" rx="5"/><text class="t" x="400.0" y="119.0" text-anchor="middle">Latent RMSNorm (learned gain)</text><line class="a" x1="400" y1="132" x2="400" y2="144" marker-end="url(#ah-moe)"/><rect class="sb" x="302.0" y="146" width="196" height="34" rx="5"/><text class="t" x="400.0" y="160.0" text-anchor="middle">EP all-to-all dispatch</text><text class="s" x="400.0" y="175.0" text-anchor="middle">capacity factor 1.15 · overflow dropped</text><line class="a" x1="238.0" y1="163" x2="300.0" y2="163" marker-end="url(#ah-moe)"/><text class="s" x="270.0" y="157" text-anchor="middle">ids</text><line class="a" x1="400" y1="180" x2="400" y2="240" marker-end="url(#ah-moe)"/><rect class="sb" x="302.0" y="242" width="196" height="34" rx="5"/><text class="t" x="400.0" y="263.0" text-anchor="middle">8 experts · SwiGLU · width 3072</text><line class="a" x1="400" y1="276" x2="400" y2="288" marker-end="url(#ah-moe)"/><rect class="sb" x="302.0" y="290" width="196" height="34" rx="5"/><text class="t" x="400.0" y="311.0" text-anchor="middle">Weighted combine</text><path class="a" d="M140,228 V307 H300.0" fill="none" marker-end="url(#ah-moe)"/><text class="s" x="148" y="300" text-anchor="start">weights</text><line class="a" x1="400" y1="324" x2="400" y2="336" marker-end="url(#ah-moe)"/><rect class="sb" x="302.0" y="338" width="196" height="34" rx="5"/><text class="t" x="400.0" y="359.0" text-anchor="middle">Latent up 3072 → 6144</text><line class="a" x1="400" y1="372" x2="400" y2="396" marker-end="url(#ah-moe)"/><text class="s" x="400" y="414" text-anchor="middle">routed output (+ shared experts in the block)</text></svg></g></g></svg>